<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-6 Astra Chat</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0f0f0f;
            color: #eee;
        }
        h1 {
            text-align: center;
            color: #10a37f;
        }
        #chat-box {
            border: 1px solid #333;
            border-radius: 12px;
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #1a1a1a;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .user {
            color: #60a5fa;
        }
        .bot {
            color: #34d399;
        }
        #input-area {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0d8c6d;
        }
    </style>
</head>
<body>
    <h1>GPT-6 Astra</h1>
    
    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Ask GPT-6 Astra anything..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = `<strong>${role === 'user' ? 'You' : 'Astra'}:</strong> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            userInput.value = '';
            addMessage('bot', 'Thinking...');

            try {
                const response = await puter.ai.chat(text, {
                    model: "openai/gpt-6-astra"
                });

                // Remove "Thinking..."
                chatBox.removeChild(chatBox.lastChild);

                const reply = response.message?.content || response;
                addMessage('bot', reply);
            } catch (err) {
                chatBox.removeChild(chatBox.lastChild);
                addMessage('bot', "Error: " + err.message);
            }
        }
    </script>
</body>
</html>
